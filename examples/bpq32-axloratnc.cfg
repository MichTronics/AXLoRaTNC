; ---------------------------------------------------------------------------
; bpq32.cfg example for AXLoRaTNC
; ESP32 DevKit V1 + EBYTE E22 SX1262, KISS over USB serial
; RF defaults: 869.480 MHz, BW 125 kHz, SF7, CR 4/5
; ---------------------------------------------------------------------------
;
; Before starting BPQ, configure the TNC from the serial console:
;
;   mode console
;   callsign YOURCALL-0
;   radio reset
;   profile fast
;   mode kiss
;
; Edit all YOURCALL / AXLORA / LOCATOR / COMPORT placeholders below.
;

SIMPLE

NODECALL=YOURCALL-7
NODEALIAS=AXLORA
LOCATOR=JO22AA

IDINTERVAL=10
BTINTERVAL=30
NODESINTERVAL=60

IDMSG:
AXLoRaTNC BPQ node on 869.480 MHz LoRa AX.25
***

BTEXT:
AXLoRaTNC BPQ node
***

INFOMSG:
AXLoRaTNC BPQ node.
KISS over USB serial to ESP32 + EBYTE E22 SX1262.
RF: 869.480 MHz, BW 125 kHz, SF7, CR 4/5.
***

CTEXT:
Welcome to the AXLoRaTNC BPQ node.
Type ? for commands.
***

FULL_CTEXT=0

; ---------------------------------------------------------------------------
; Port 1: AXLoRaTNC KISS serial port
; ---------------------------------------------------------------------------

PORT
 PORTNUM=1
 ID=AXLoRaTNC 869.480 LoRa AX25
 TYPE=ASYNC
 PROTOCOL=KISS

 ; Use a stable /dev/serial/by-id/... path if possible.
 ; Example:
 ; COMPORT=/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
 COMPORT=/dev/ttyUSB0
 SPEED=115200
 CHANNEL=A

 ; Fast LoRa/KISS timing. These override the TNC KISS parameters.
 FULLDUP=0
 TXDELAY=0
 PERSIST=255
 SLOTTIME=10
 TXTAIL=0

 ; Conservative AX.25 over LoRa settings.
 MAXFRAME=1
 FRACK=8000
 RESPTIME=1000
 RETRIES=10
 PACLEN=80

 ; Reduce extra serial/KISS chatter.
 NOKEEPALIVES=1

 ; NET/ROM quality. Set QUALITY=0 if you do not want this port to
 ; advertise/use NET/ROM routes.
 QUALITY=120
 MINQUAL=80

 ; BPQ digipeating. AXLoRaTNC can also digipeat internally; avoid enabling
 ; both unless you intentionally want both layers doing it.
 DIGIFLAG=0
 DIGIPORT=0

 USERS=0
ENDPORT

; Optional local applications. Enable only if configured in your BPQ install.
; APPLICATION 1,BBS,,YOURCALL-1,AXBBS,255
; APPLICATION 2,CHAT,,YOURCALL-2,AXCHT,255

ROUTES:
; Optional locked routes:
; CALLSIGN,QUALITY,PORT[,MAXFRAME,FRACK,PACLEN]
***

; End of bpq32.cfg

